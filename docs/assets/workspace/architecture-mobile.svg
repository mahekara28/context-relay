<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1110" viewBox="0 0 640 1110" role="img" aria-labelledby="title description">
<title id="title">Context Relay — one workspace, two integration paths</title>
<desc id="description">The npm package runs locally. Native capture adapters and MCP tools connect four harnesses to one context service. SQLite stores reviewed state. Optional Nebius proposals require approval and review.</desc>
