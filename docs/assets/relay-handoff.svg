<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title desc">
  <title id="title">A correction survives the handoff</title>
  <desc id="desc">One: record Use CSV. Two: explicitly supersede it with Use JSON. Three: offer the current task revision. Four: the named receiver accepts it after revision and packet checks. Acceptance does not verify task completion.</desc>
  <rect x="1" y="1" width="1278" height="448" rx="22" fill="#f5f3eb" stroke="#dcded2" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1b2b23">
    <text x="48" y="49" font-size="15" font-weight="700" letter-spacing="2" fill="#58634f">01 / THE HANDOFF</text>
    <text x="46" y="106" font-size="40" font-weight="700" letter-spacing="-1">A correction survives the handoff.</text>
    <path d="M72 166H1199" stroke="#bac3ac" stroke-width="2"/>
    <g fill="#1b2b23"><circle cx="72" cy="166" r="20"/><circle cx="374" cy="166" r="20"/><circle cx="676" cy="166" r="20"/><circle cx="978" cy="166" r="20"/></g>
    <g fill="#d0f28e" text-anchor="middle" font-size="17" font-weight="700"><text x="72" y="172">1</text><text x="374" y="172">2</text><text x="676" y="172">3</text><text x="978" y="172">4</text></g>
    <g font-size="23" font-weight="700"><text x="48" y="225">Record intent</text><text x="350" y="225">Apply the correction</text><text x="652" y="225">Offer a snapshot</text><text x="954" y="225">Accept fresh state</text></g>
    <g font-size="20" fill="#4e5d50">
      <text x="48" y="263">“Use CSV.”</text><text x="48" y="293">Keep its source reference.</text>
      <text x="350" y="263">“Actually, use JSON.”</text><text x="350" y="293">Supersede the old entry.</text>
      <text x="652" y="263">Freeze the task at r2.</text><text x="652" y="293">Address it to a receiver.</text>
      <text x="954" y="263">Check recipient + revision.</text><text x="954" y="293">Then continue the work.</text>
    </g>
    <g font-size="15" font-family="Menlo, Consolas, monospace">
      <rect x="48" y="319" width="238" height="35" rx="7" fill="#e5e6dd"/><text x="62" y="342">source: message-1</text>
      <rect x="350" y="319" width="238" height="35" rx="7" fill="#e6ddf7"/><text x="364" y="342">CSV → JSON</text>
      <rect x="652" y="319" width="238" height="35" rx="7" fill="#e5e6dd"/><text x="666" y="342">revision: 2</text>
      <rect x="954" y="319" width="238" height="35" rx="7" fill="#dcefbc"/><text x="968" y="342">status: accepted</text>
    </g>
    <path d="M48 383H1232" stroke="#d4d8ca"/>
    <text x="48" y="417" font-size="18" fill="#58634f">Old instructions stay in history. Completion still needs a separate host-run check.</text>
  </g>
</svg>
