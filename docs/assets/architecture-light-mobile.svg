<svg xmlns="http://www.w3.org/2000/svg" width="640" height="655" viewBox="0 0 640 655" role="img" aria-labelledby="title desc">
<title id="title">Local task architecture</title><desc id="desc">Project-configured Claude Code and Codex CLI, or manually configured MCP clients, call the optional stdio server. MCP, CLI and Python access the task service and local SQLite. The host supplies identity and completion checks.</desc>
