<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="565" viewBox="0 0 1280 565" role="img" aria-labelledby="title desc">
  <title id="title">Inside a task context packet</title>
  <desc id="desc">A versioned packet carries the goal and completion criteria, active sourced instructions, Git workspace identity, artifact references and digests, evidence with provenance, and open work. Required state must fit the character budget; omitted optional artifacts and evidence are counted.</desc>
  <rect width="1280" height="565" rx="22" fill="#192820"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="49" font-size="15" font-weight="700" letter-spacing="2" fill="#b9c9b8">02 / THE CONTEXT CONTRACT</text>
    <text x="46" y="106" font-size="40" font-weight="700" letter-spacing="-1" fill="#f5f3eb">One packet. Six things worth carrying.</text>
    <rect x="48" y="152" width="352" height="317" rx="14" fill="#c8bcf6"/>
    <g fill="none" stroke="#27332c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M88 196H119L131 208V254H88ZM119 196V208H131M98 224H121M98 236H116"/>
      <path d="M140 222H163M156 215L163 222L156 229"/>
    </g>
    <text x="80" y="303" font-size="35" font-weight="700" letter-spacing="-1" fill="#192820">Task packet</text>
    <text x="80" y="339" font-size="20" fill="#354339">A snapshot you can inspect.</text>
    <path d="M80 367H368" stroke="#9186b2"/>
    <text x="80" y="402" font-size="16" font-family="Menlo, Consolas, monospace" fill="#28352b">task-packet/v1alpha1</text>
    <text x="80" y="434" font-size="17" fill="#354339">Task ID · revision · status</text>
    <g fill="none" stroke="#445747"><path d="M436 153H1232M436 258H1232M436 363H1232M436 468H1232M834 153V468"/></g>
    <g font-size="21" font-weight="700" fill="#d0f28e">
      <text x="460" y="192">01  Goal + criteria</text><text x="860" y="192">02  Current instructions</text>
      <text x="460" y="297">03  Workspace identity</text><text x="860" y="297">04  Artifact references</text>
      <text x="460" y="402">05  Evidence + provenance</text><text x="860" y="402">06  Open work</text>
    </g>
    <g font-size="19" fill="#d6dfd3">
      <text x="460" y="225">What the task must achieve.</text><text x="860" y="225">Active entries, with sources.</text>
      <text x="460" y="330">Repository, branch and commit.</text><text x="860" y="330">Paths and content digests.</text>
      <text x="460" y="435">Where each recorded claim came from.</text><text x="860" y="435">What the next agent should pick up.</text>
    </g>
    <circle cx="55" cy="514" r="5" fill="#d0f28e"/>
    <text x="73" y="521" font-size="18" fill="#b9c9b8">Explicit character budget. Required state stays intact. Optional omissions are counted.</text>
  </g>
</svg>
