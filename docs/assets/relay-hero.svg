<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Context Relay — give the next agent a place to pick up</title>
  <desc id="desc">A sender records a revised JSON instruction. A versioned context packet carries the goal, sources and open work to a receiver. Local task continuity through Python, the CLI and optional MCP.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#34453d"/></pattern>
  </defs>
  <rect width="1280" height="620" rx="24" fill="#16251f"/>
  <rect x="640" y="100" width="608" height="424" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="none" stroke="#d0f28e" stroke-width="3" stroke-linejoin="round">
      <path d="M64 41H54V65H64M80 49H90V73H80M65 57H79M74 52L79 57L74 62"/>
    </g>
    <text x="108" y="65" font-size="17" letter-spacing="2" fill="#dbe4da">LOCAL TASK CONTINUITY</text>
    <rect x="1012" y="37" width="204" height="36" rx="18" fill="#2b3b33"/>
    <circle cx="1032" cy="55" r="4" fill="#d0f28e"/>
    <text x="1047" y="61" font-size="14" font-weight="700" letter-spacing="1.4" fill="#d0f28e">SOURCE PREVIEW</text>
    <path d="M64 100H1216" stroke="#3c4d43"/>
    <text x="60" y="231" font-size="108" font-weight="700" letter-spacing="-5" fill="#f6f4eb">Context</text>
    <text x="60" y="338" font-size="108" font-weight="700" letter-spacing="-5" fill="#d0f28e">Relay<tspan fill="#c8bcf6">.</tspan></text>
    <text x="66" y="401" font-size="30" fill="#f6f4eb">Give the next agent</text>
    <text x="66" y="441" font-size="30" fill="#f6f4eb">a place to pick up.</text>
    <text x="66" y="488" font-size="18" fill="#aabcb0">Current instructions. Sources. Unfinished work.</text>
    <path d="M730 231H692V346H726M1118 346H1200V459H1166" fill="none" stroke="#d0f28e" stroke-width="3"/>
    <path d="M718 339L726 346L718 353M1174 452L1166 459L1174 466" fill="none" stroke="#d0f28e" stroke-width="3"/>
    <rect x="740" y="156" width="436" height="108" rx="16" fill="#26372e" stroke="#526353"/>
    <rect x="760" y="176" width="35" height="32" rx="8" fill="#c8bcf6"/>
    <text x="777" y="199" text-anchor="middle" font-size="20" font-weight="700" fill="#16251f">A</text>
    <text x="811" y="198" font-size="16" letter-spacing="1.6" fill="#c8bcf6">SENDER</text>
    <text x="761" y="240" font-size="23" fill="#f6f4eb">“Actually, use JSON.”</text>
    <rect x="726" y="294" width="402" height="104" rx="16" fill="#d0f28e"/>
    <text x="750" y="329" font-size="15" font-weight="700" letter-spacing="1.7" fill="#344a2f">TASK CONTEXT / REVISION 2</text>
    <text x="750" y="370" font-size="24" font-weight="700" fill="#16251f">Goal + sources + next steps</text>
    <rect x="798" y="430" width="368" height="82" rx="16" fill="#26372e" stroke="#526353"/>
    <rect x="818" y="450" width="35" height="32" rx="8" fill="#c8bcf6"/>
    <text x="835" y="473" text-anchor="middle" font-size="20" font-weight="700" fill="#16251f">B</text>
    <text x="870" y="459" font-size="14" letter-spacing="1.5" fill="#c8bcf6">RECEIVER</text>
    <text x="870" y="489" font-size="21" fill="#f6f4eb">Continue from this state.</text>
    <path d="M64 546H1216" stroke="#3c4d43"/>
    <g font-size="16" letter-spacing="1.5" fill="#dbe4da">
      <text x="65" y="586">VERSIONED CONTEXT</text>
      <text x="476" y="586">MCP / STDIO</text>
      <text x="866" y="586">LOCAL SQLITE</text>
    </g>
    <g fill="#c8bcf6"><path d="M395 573L401 579L395 585L389 579Z"/><path d="M786 573L792 579L786 585L780 579Z"/></g>
  </g>
</svg>
