<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Six things in a task context packet</title>
  <desc id="desc">Goal and criteria, sourced active instructions, workspace identity, artifact references, evidence provenance, and open work. Required state must fit the character budget; optional omissions are counted.</desc>
  <rect width="600" height="900" rx="22" fill="#192820"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="49" font-size="21" letter-spacing="1.5" fill="#b9c9b8">02 / THE CONTEXT CONTRACT</text>
    <text x="34" y="107" font-size="38" font-weight="700" fill="#f5f3eb">One packet. Six things</text>
    <text x="34" y="152" font-size="38" font-weight="700" fill="#f5f3eb">worth carrying.</text>
    <rect x="36" y="181" width="528" height="52" rx="10" fill="#c8bcf6"/>
    <text x="54" y="215" font-size="24" fill="#192820">Task ID · revision · status</text>
    <g stroke="#445747"><path d="M36 334H564M36 426H564M36 518H564M36 610H564M36 702H564M36 794H564"/></g>
    <g font-size="28" font-weight="700" fill="#d0f28e">
      <text x="36" y="282">01  Goal + criteria</text><text x="36" y="374">02  Current instructions</text>
      <text x="36" y="466">03  Workspace identity</text><text x="36" y="558">04  Artifact references</text>
      <text x="36" y="650">05  Evidence + provenance</text><text x="36" y="742">06  Open work</text>
    </g>
    <g font-size="25" fill="#d6dfd3">
      <text x="36" y="317">What the task must achieve.</text><text x="36" y="409">Active entries, with sources.</text>
      <text x="36" y="501">Repository, branch and commit.</text><text x="36" y="593">Paths and content digests.</text>
      <text x="36" y="685">Where each recorded claim came from.</text><text x="36" y="777">What to pick up next.</text>
    </g>
    <text x="36" y="839" font-size="23" fill="#b9c9b8">An explicit character budget.</text>
    <text x="36" y="872" font-size="23" fill="#b9c9b8">Optional omissions are counted.</text>
  </g>
</svg>
