<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780" role="img" aria-labelledby="title desc">
  <title id="title">Different tools, one local task state</title>
  <desc id="desc">Claude Code and Codex CLI have project configuration generators. Other MCP clients require manual stdio setup. All connect through the optional MCP server to the local task service and SQLite store. CLI and Python also access that service directly.</desc>
  <rect x="1" y="1" width="598" height="778" rx="22" fill="#f5f3eb" stroke="#dcded2" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1b2b23">
    <text x="36" y="49" font-size="21" letter-spacing="1.5" fill="#58634f">03 / THE CONNECTIONS</text>
    <text x="34" y="106" font-size="38" font-weight="700">Different tools.</text>
    <text x="34" y="151" font-size="38" font-weight="700">One local task state.</text>
    <rect x="36" y="195" width="528" height="108" rx="12" fill="#fffef8" stroke="#c4cbb9"/>
    <text x="60" y="240" font-size="30" font-weight="700">Claude Code · Codex CLI</text>
    <text x="60" y="280" font-size="25" fill="#58634f">Project config generators</text>
    <rect x="36" y="327" width="528" height="108" rx="12" fill="#fffef8" stroke="#c4cbb9"/>
    <text x="60" y="372" font-size="30" font-weight="700">Other MCP clients</text>
    <text x="60" y="412" font-size="25" fill="#58634f">Manual stdio setup</text>
    <path d="M564 249H581V463H300V488M300 435V488M292 480L300 488L308 480" fill="none" stroke="#74826b" stroke-width="2"/>
    <rect x="36" y="488" width="528" height="76" rx="12" fill="#e4dcf7"/>
    <text x="300" y="535" text-anchor="middle" font-size="29" font-weight="700">Optional MCP / stdio</text>
    <path d="M300 564V604M292 596L300 604L308 596" fill="none" stroke="#74826b" stroke-width="2"/>
    <rect x="36" y="604" width="528" height="76" rx="12" fill="#dcefbc"/>
    <text x="300" y="651" text-anchor="middle" font-size="29" font-weight="700">Task service + SQLite</text>
    <text x="36" y="726" font-size="24" fill="#58634f">CLI + Python also access this service.</text>
    <text x="36" y="760" font-size="24" fill="#58634f">The host injects context and checks results.</text>
  </g>
</svg>
