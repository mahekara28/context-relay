<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title desc">
  <title id="title">Different tools, one local task state</title>
  <desc id="desc">Project configuration generators are available for Claude Code and Codex CLI. Other MCP clients require manual stdio setup. These clients reach the task service through the optional MCP server. The CLI and Python API reach the same task service directly. The service stores context in local SQLite. Live model handoff evaluation remains pending.</desc>
  <rect x="1" y="1" width="1278" height="448" rx="22" fill="#f5f3eb" stroke="#dcded2" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1b2b23">
    <text x="48" y="49" font-size="15" font-weight="700" letter-spacing="2" fill="#58634f">03 / THE CONNECTIONS</text>
    <text x="46" y="106" font-size="40" font-weight="700" letter-spacing="-1">Different tools. One local task state.</text>
    <g fill="#fffef8" stroke="#c4cbb9" stroke-width="1.5">
      <rect x="48" y="147" width="252" height="88" rx="12"/><rect x="334" y="147" width="252" height="88" rx="12"/><rect x="620" y="147" width="252" height="88" rx="12"/><rect x="918" y="147" width="314" height="88" rx="12"/>
    </g>
    <g text-anchor="middle">
      <g font-size="23" font-weight="700"><text x="174" y="183">Claude Code</text><text x="460" y="183">Codex CLI</text><text x="746" y="183">Other MCP clients</text><text x="1075" y="183">CLI / Python</text></g>
      <g font-size="17" fill="#58634f"><text x="174" y="213">Project config generator</text><text x="460" y="213">Project config generator</text><text x="746" y="213">Manual stdio setup</text><text x="1075" y="213">Direct service access</text></g>
    </g>
    <g fill="none" stroke="#74826b" stroke-width="2"><path d="M174 235V263H746V235M460 235V291M1075 235V291"/></g>
    <rect x="48" y="291" width="824" height="65" rx="12" fill="#e4dcf7"/>
    <text x="460" y="331" text-anchor="middle" font-size="22" font-weight="700">Optional MCP server / stdio</text>
    <path d="M460 356V380H1075V356" fill="none" stroke="#74826b" stroke-width="2"/>
    <rect x="918" y="291" width="314" height="65" rx="12" fill="#dcefbc"/>
    <text x="1075" y="331" text-anchor="middle" font-size="22" font-weight="700">Task service + SQLite</text>
    <path d="M1069 364L1075 356L1081 364" fill="none" stroke="#74826b" stroke-width="2"/>
    <text x="48" y="420" font-size="18" fill="#58634f">Explicit tool calls and local storage. The host controls context injection, identity and completion checks.</text>
  </g>
</svg>
