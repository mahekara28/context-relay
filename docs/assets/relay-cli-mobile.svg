<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750" role="img" aria-labelledby="title desc">
  <title id="title">The receiver accepts revision 2 with the JSON instruction</title>
  <desc id="desc">Illustrated CLI walkthrough with abbreviated actual output. The receiver accepts a handoff containing Use JSON sourced to message-2. No completion check has been recorded. IDs and other fields are omitted.</desc>
  <rect width="600" height="750" rx="22" fill="#101b17"/>
  <path d="M0 22Q0 0 22 0H578Q600 0 600 22V70H0Z" fill="#26372e"/>
  <circle cx="30" cy="35" r="7" fill="#e99a82"/><circle cx="54" cy="35" r="7" fill="#e2cd86"/><circle cx="78" cy="35" r="7" fill="#b9d68d"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="109" y="44" font-size="23" fill="#e4eadf">context-relay / handoff</text>
    <text x="32" y="116" font-size="22" letter-spacing="1.5" fill="#d0f28e">RECEIVER</text>
  </g>
  <g font-family="Menlo, Consolas, monospace" font-size="24">
    <text x="32" y="164" fill="#dce7d8">$ context-relay handoff</text>
    <text x="55" y="199" fill="#dce7d8">--subject receiver</text>
    <text x="55" y="234" fill="#dce7d8">accept HANDOFF_ID</text>
    <text x="32" y="292" fill="#93a895">{</text>
    <text x="55" y="330" fill="#dce7d8">"revision": <tspan fill="#c8bcf6">2</tspan>,</text>
    <text x="55" y="368" fill="#dce7d8">"status": <tspan fill="#d0f28e">"accepted"</tspan>,</text>
    <text x="55" y="406" fill="#dce7d8">"packet": {</text>
    <text x="78" y="444" fill="#dce7d8">"instructions": [{</text>
    <text x="101" y="482" fill="#dce7d8">"text": <tspan fill="#d0f28e">"Use JSON"</tspan></text>
    <text x="55" y="520" fill="#93a895">... }</text>
  </g>
  <rect x="32" y="550" width="536" height="105" rx="12" fill="#26372e"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="593" font-size="27" font-weight="700" fill="#d0f28e">Context accepted.</text>
    <text x="52" y="632" font-size="24" fill="#c8d5c5">Completion remains unverified.</text>
    <text x="32" y="700" font-size="22" fill="#b1c1b3">Illustrated, abbreviated command output.</text>
    <text x="32" y="732" font-size="22" fill="#b1c1b3">IDs and other fields omitted. No model calls.</text>
  </g>
</svg>
