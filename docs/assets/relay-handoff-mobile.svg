<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">A correction survives the handoff</title>
  <desc id="desc">Record CSV with a source. Explicitly replace it with JSON. Offer revision 2. The receiver accepts after freshness checks. Completion remains a separate host-run check.</desc>
  <rect x="1" y="1" width="598" height="898" rx="22" fill="#f5f3eb" stroke="#dcded2" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1b2b23">
    <text x="36" y="49" font-size="21" letter-spacing="2" fill="#58634f">01 / THE HANDOFF</text>
    <text x="34" y="106" font-size="38" font-weight="700">A correction survives</text>
    <text x="34" y="151" font-size="38" font-weight="700">the handoff.</text>
    <path d="M60 227V716" stroke="#bac3ac" stroke-width="2"/>
    <g fill="#1b2b23"><circle cx="60" cy="227" r="24"/><circle cx="60" cy="390" r="24"/><circle cx="60" cy="553" r="24"/><circle cx="60" cy="716" r="24"/></g>
    <g fill="#d0f28e" text-anchor="middle" font-size="24" font-weight="700"><text x="60" y="236">1</text><text x="60" y="399">2</text><text x="60" y="562">3</text><text x="60" y="725">4</text></g>
    <g font-size="30" font-weight="700"><text x="108" y="238">Record intent</text><text x="108" y="401">Apply the correction</text><text x="108" y="564">Offer a snapshot</text><text x="108" y="727">Accept fresh state</text></g>
    <g font-size="26" fill="#4e5d50">
      <text x="108" y="283">“Use CSV.”</text><text x="108" y="319">Keep its source reference.</text>
      <text x="108" y="446">“Actually, use JSON.”</text><text x="108" y="482">Supersede the old entry.</text>
      <text x="108" y="609">Freeze the task at r2.</text><text x="108" y="645">Address it to a receiver.</text>
      <text x="108" y="772">Check recipient + revision.</text>
    </g>
    <path d="M36 814H564" stroke="#d4d8ca"/>
    <text x="36" y="858" font-size="23" fill="#58634f">Completion needs a separate host-run check.</text>
  </g>
</svg>
