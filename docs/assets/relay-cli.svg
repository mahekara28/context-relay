<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="title desc">
  <title id="title">A local handoff, from instruction change to accepted context</title>
  <desc id="desc">Illustrated CLI walkthrough using abbreviated results from the documented commands. After a CSV instruction is superseded by JSON, the offered packet has revision 2 and only the active JSON instruction from message-2. The receiver accepts the handoff. No completion verification is stored yet. IDs and fields are omitted for readability.</desc>
  <rect width="1280" height="570" rx="22" fill="#101b17"/>
  <path d="M0 22Q0 0 22 0H1258Q1280 0 1280 22V67H0Z" fill="#26372e"/>
  <circle cx="30" cy="34" r="6" fill="#e99a82"/><circle cx="52" cy="34" r="6" fill="#e2cd86"/><circle cx="74" cy="34" r="6" fill="#b9d68d"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="106" y="41" font-size="17" fill="#e4eadf">context-relay / local handoff</text>
    <text x="1232" y="41" text-anchor="end" font-size="15" fill="#b1c1b3">ILLUSTRATED CLI WALKTHROUGH</text>
    <text x="48" y="115" font-size="16" font-weight="700" letter-spacing="1.5" fill="#c8bcf6">SENDER</text>
    <text x="742" y="115" font-size="16" font-weight="700" letter-spacing="1.5" fill="#d0f28e">RECEIVER</text>
  </g>
  <path d="M696 94V474" stroke="#3b4e40"/>
  <g font-family="Menlo, Consolas, monospace" font-size="19">
    <text x="48" y="157" fill="#dce7d8">$ context-relay handoff --subject sender</text>
    <text x="70" y="188" fill="#dce7d8">offer TASK_ID --recipient receiver</text>
    <text x="48" y="241" fill="#93a895">{</text>
    <text x="70" y="274" fill="#dce7d8">"revision": <tspan fill="#c8bcf6">2</tspan>,</text>
    <text x="70" y="307" fill="#dce7d8">"status": <tspan fill="#d0f28e">"offered"</tspan>,</text>
    <text x="70" y="340" fill="#dce7d8">"packet": { "instructions": [{</text>
    <text x="94" y="373" fill="#dce7d8">"text": <tspan fill="#d0f28e">"Use JSON"</tspan>,</text>
    <text x="94" y="406" fill="#dce7d8">"source": {</text>
    <text x="118" y="439" fill="#dce7d8">"kind": "user", "ref": "message-2"</text>
    <text x="70" y="472" fill="#93a895">... }</text>
    <text x="742" y="157" fill="#dce7d8">$ context-relay handoff</text>
    <text x="764" y="188" fill="#dce7d8">--subject receiver accept HANDOFF_ID</text>
    <text x="742" y="241" fill="#93a895">{</text>
    <text x="766" y="274" fill="#dce7d8">"revision": <tspan fill="#c8bcf6">2</tspan>,</text>
    <text x="766" y="307" fill="#dce7d8">"status": <tspan fill="#d0f28e">"accepted"</tspan></text>
    <text x="742" y="340" fill="#93a895">... }</text>
  </g>
  <rect x="742" y="379" width="490" height="94" rx="10" fill="#26372e"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="764" y="413" font-size="21" font-weight="700" fill="#d0f28e">Context accepted. Work can continue.</text>
    <text x="764" y="446" font-size="18" fill="#c8d5c5">Completion has not been verified.</text>
    <path d="M48 502H1232" stroke="#3b4e40"/>
    <text x="48" y="538" font-size="17" fill="#b1c1b3">Abbreviated output from the quickstart commands · IDs and other fields omitted · No model calls</text>
  </g>
</svg>
