<text x="370" y="159" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#17191c" text-anchor="start">MCP / stdio</text>
<text x="370" y="188" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#616872" text-anchor="start">Reads and reports</text>
