<text x="40" y="48" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#616872" text-anchor="start">LOCAL TASK ARCHITECTURE</text>
<text x="40" y="132" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#17191c" text-anchor="start">Claude Code</text>
<text x="40" y="167" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#17191c" text-anchor="start">Codex CLI</text>
<text x="40" y="202" font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="400" fill="#616872" text-anchor="start">Other MCP clients</text>
<text x="40" y="230" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#616872" text-anchor="start">manual stdio setup</text>
