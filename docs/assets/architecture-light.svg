<text x="702" y="159" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" fill="#17191c" text-anchor="start">Task service</text>
<text x="702" y="188" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#616872" text-anchor="start">Revisions and handoffs</text>
<rect x="1022" y="124" width="218" height="92" rx="4" fill="#f6f7f8" stroke="#d9dde2"/>
